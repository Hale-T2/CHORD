[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "chordlab"
version = "0.1.0"
description = "Teaching code for following a chord-recognition paper (CQT + template matching vs. HMM/Viterbi) down to the RWC dataset"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "librosa>=0.10",
    "soundfile>=0.12",
    "mir_eval>=0.7",
    "pretty_midi>=0.2.10",
    "ipython>=8.0",
    "jinja2>=3.0",
]

[project.optional-dependencies]
remote = ["remotezip>=0.12"]
dev = ["pytest>=7", "nbclient>=0.9", "ipykernel>=6", "jupyterlab>=4"]
docs = ["jupyter-book>=1.0,<2", "sphinxcontrib-bibtex>=2.5"]

[tool.setuptools]
packages = ["chordlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
